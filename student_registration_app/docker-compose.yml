version: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["./wait-for-it.sh", "db:5432", "--timeout=60", "--", "python", "app/app.py"]
  db:
    image: postgres
    environment:
      POSTGRES_DB: student_registration
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d student_registration"]
      interval: 10s
      timeout: 5s
      retries: 5

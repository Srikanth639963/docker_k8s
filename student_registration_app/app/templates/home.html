{% extends "layout.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        text-align: center;
        background-color: #fff;
        padding: 20px 40px;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
        color: #333;
        font-size: 2.5rem;
        margin-bottom: 1rem;
    }

    p {
        font-size: 1.2rem;
        color: #666;
        margin-bottom: 1.5rem;
    }

    a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 1.2rem;
    }

    a:hover {
        background-color: #0056b3;
    }

    @media (max-width: 768px) {
        .container {
            padding: 15px 30px;
        }

        h1 {
            font-size: 2rem;
        }

        p {
            font-size: 1rem;
        }

        a {
            font-size: 1rem;
            padding: 10px 20px;
        }
    }
</style>

<div class="container">
    <h1>Welcome to the Student Portal</h1>
    <p>Click the button below to register student details.</p>
    <a href="/register">Go to Registration</a>
</div>

{% endblock %}
